name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: サーバー（テスト・依存関係の脆弱性）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # 本番に入る依存で、重大度 high 以上の脆弱性があれば失敗させる
      - run: npm audit --omit=dev --audit-level=high

  admin:
    name: 管理画面（型チェック・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  app:
    name: アプリ（型チェック）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Expoの依存にpeer依存の競合があるため --legacy-peer-deps を付ける
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
